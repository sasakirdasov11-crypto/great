<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GREAT v0.1.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #17212b; color: #fff; height: 100vh; overflow: hidden; }
  .screen { display: none; height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }
  
  /* ЭКРАН РЕГИСТРАЦИИ */
  #auth { justify-content: center; align-items: center; padding: 24px; }
  .auth-box { width: 100%; max-width: 360px; text-align: center; }
  .logo { width: 84px; height: 84px; border-radius: 50%; background: #2aabee; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; }
  .auth-box h1 { font-size: 26px; margin-bottom: 4px; }
  .ver { color: #7f91a4; font-size: 12px; margin-bottom: 26px; }
  .input-wrap { position: relative; margin-bottom: 14px; }
  .input-wrap span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #7f91a4; }
  #username { width: 100%; padding: 15px 16px 15px 36px; border-radius: 10px; border: 1px solid #2b3a4a; background: #242f3d; color: #fff; font-size: 16px; outline: none; }
  #username:focus { border-color: #2aabee; }
  .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #2aabee; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:active { opacity: .8; }
  .error { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ГЛАВНЫЙ ЭКРАН */
  .header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #17212b; border-bottom: 1px solid #0e1621; }
  .header h2 { font-size: 18px; }
  .header .me { color: #2aabee; font-size: 13px; }
  .tabs { display: flex; border-bottom: 1px solid #0e1621; }
  .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #7f91a4; font-size: 14px; }
  .tab.active { color: #2aabee; border-bottom: 2px solid #2aabee; }
  .content { flex: 1; overflow-y: auto; }
  .search-wrap { padding: 10px 16px; }
  .search-wrap input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #2b3a4a; background: #242f3d; color: #fff; font-size: 14px; outline: none; }
  
  /* СПИСОК ЧАТОВ */
  .chat-item { padding: 12px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .chat-item:active { background: #202b36; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2aabee; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-info .name { font-weight: 600; margin-bottom: 2px; }
  .chat-info .last { color: #7f91a4; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 11px; color: #22c55e; margin-left: 6px; }
  .empty { text-align: center; color: #7f91a4; font-size: 14px; margin-top: 40px; padding: 0 20px; }

  /* ЭКРАН ЧАТА */
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; background: #0e1621; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .msg.out { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 4px; }
  .msg.in { align-self: flex-start; background: #182533; border-bottom-left-radius: 4px; }
  .msg .time { display: inline-block; font-size: 10px; opacity: .6; margin-left: 6px; }
  .composer { padding: 10px 12px; display: flex; gap: 8px; background: #17212b; border-top: 1px solid #0e1621; }
  #msgInput { flex: 1; padding: 12px 16px; border-radius: 22px; border: none; background: #242f3d; color: #fff; font-size: 15px; outline: none; }
  .send { width: 46px; height: 46px; border-radius: 50%; border: none; background: #2aabee; color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .back { background: none; border: none; color: #2aabee; font-size: 26px; cursor: pointer; padding: 0 6px; }

  /* АДМИНКА */
  .admin-user { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0e1621; flex-wrap: wrap; }
  .admin-user .info { flex: 1; min-width: 120px; }
  .admin-user .info .name { font-weight: 600; }
  .admin-user .info .role { font-size: 11px; color: #7f91a4; }
  .admin-user button { padding: 7px 11px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer; margin-left: 4px; }
  .b-danger { background: #ef4444; color: #fff; }
  .b-success { background: #22c55e; color: #fff; }
  .b-ghost { background: #242f3d; color: #fff; }
  .admin-chat { padding: 12px 16px; border-bottom: 1px solid #0e1621; cursor: pointer; }
  .admin-chat .row { display: flex; justify-content: space-between; font-weight: 600; }
  .admin-chat .preview { color: #7f91a4; font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .section-title { padding: 12px 16px 6px; font-weight: 600; color: #7f91a4; font-size: 13px; }
</style>
</head>
<body>

<!-- РЕГИСТРАЦИЯ -->
<div id="auth" class="screen active">
  <div class="auth-box">
    <div class="logo">G</div>
    <h1>GREAT</h1>
    <div class="ver">версия 0.1.0</div>
    <div class="input-wrap">
      <span>@</span>
      <input id="username" type="text" placeholder="username" autocomplete="off" maxlength="20">
    </div>
    <button class="btn" onclick="doRegister()">Войти</button>
    <div class="error" id="authError"></div>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main" class="screen">
  <div class="header"><h2>GREAT</h2><span class="me" id="myName"></span></div>
  <div class="tabs">
    <div class="tab active" data-tab="chats" onclick="switchTab('chats')">Чаты</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">Люди</div>
    <div class="tab" data-tab="admin" id="adminTab" style="display:none;" onclick="switchTab('admin')">Админ</div>
  </div>
  <div class="content" id="tabContent"></div>
</div>

<!-- ЧАТ -->
<div id="room" class="screen">
  <div class="header">
    <button class="back" onclick="goBack()">‹</button>
    <div class="avatar" id="roomAvatar" style="width:38px;height:38px;font-size:16px;"></div>
    <div style="flex:1;">
      <div style="font-weight:600;" id="roomTitle"></div>
      <div style="font-size:11px;color:#7f91a4;">личный чат</div>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
    <button class="send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
const ws = new WebSocket(wsProto + location.host);
let me = null, currentChat = null, onlineUsers = [], adminUsers = [], adminChats = [];

function send(data) { if (ws.readyState === 1) ws.send(JSON.stringify(data)); }
function esc(t) { return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function doRegister() {
  const name = document.getElementById('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (name.length < 3) { document.getElementById('authError').textContent = 'Минимум 3 символа'; return; }
  send({ type: 'register', username: name });
}

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if (name === 'chats') renderChatsTab(); else if (name === 'users') renderUsersTab(); else if (name === 'admin') renderAdminTab();
}

function renderChatsTab() {
  const box = document.getElementById('tabContent');
  box.innerHTML = '<div class="search-wrap"><input id="search" placeholder="Поиск по @username" oninput="renderChatsTab()"></div><div id="chatList"></div>';
  const q = (document.getElementById('search').value || '').toLowerCase().replace('@', '');
  const list = document.getElementById('chatList');
  const others = onlineUsers.filter(u => u.username !== me.username && u.username.includes(q));
  if (!others.length) { list.innerHTML = '<div class="empty">Никого не найдено</div>'; return; }
  others.forEach(u => {
    const div = document.createElement('div');
    div.className = 'chat-item'; div.onclick = () => openChat(u.username);
    div.innerHTML = `<div class="avatar">${u.username[0].toUpperCase()}</div><div class="chat-info"><div class="name">@${u.username}${u.role === 'admin' ? '<span class="status" style="color:#f59e0b;">★</span>' : ''}</div><div class="last">${u.online ? 'онлайн' : 'не в сети'}</div></div>`;
    list.appendChild(div);
  });
}

function renderUsersTab() {
  const box = document.getElementById('tabContent');
  const others = onlineUsers.filter(u => u.username !== me.username);
  if (!others.length) { box.innerHTML = '<div class="empty">Пользователей нет</div>'; return; }
  box.innerHTML = '<div class="section-title">Все пользователи</div>';
  others.forEach(u => {
    const div = document.createElement('div');
    div.className = 'chat-item'; div.onclick = () => openChat(u.username);
    div.innerHTML = `<div class="avatar">${u.username[0].toUpperCase()}</div><div class="chat-info"><div class="name">@${u.username}${u.role === 'admin' ? ' ★' : ''}</div><div class="last">${u.role === 'admin' ? 'Администратор' : 'Пользователь'}</div></div>`;
    box.appendChild(div);
  });
}

function openChat(username) {
  currentChat = username;
  document.getElementById('roomTitle').textContent = '@' + username;
  document.getElementById('roomAvatar').textContent = username[0].toUpperCase();
  document.getElementById('messages').innerHTML = '';
  send({ type: 'open_chat', with: username });
  showScreen('room');
}

function renderMessages(msgs) {
  const box = document.getElementById('messages');
  box.innerHTML = msgs.length ? '' : '<div class="empty">Начни общение 👋</div>';
  msgs.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === me.username ? 'out' : 'in');
    const d = new Date(m.time); const tm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    div.innerHTML = `${esc(m.text)}<span class="time">${tm}</span>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msgInput'); const text = input.value.trim();
  if (!text || !currentChat) return;
  send({ type: 'send_message', to: currentChat, text }); input.value = '';
}

document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
function goBack() { currentChat = null; showScreen('main'); switchTab('chats'); }

function renderAdminTab() {
  const box = document.getElementById('tabContent');
  box.innerHTML = '<div class="search-wrap"><button class="btn b-ghost" onclick="send({type:\'admin_users\'});send({type:\'admin_chats\'})">Обновить данные</button></div>';
  send({ type: 'admin_users' }); send({ type: 'admin_chats' });
}

function renderAdminView(users, chats) {
  const box = document.getElementById('tabContent');
  box.innerHTML = '<div class="section-title">Пользователи</div>';
  users.forEach(u => {
    const div = document.createElement('div'); div.className = 'admin-user';
    div.innerHTML = `<div class="avatar" style="width:40px;height:40px;font-size:16px;">${u.username[0].toUpperCase()}</div><div class="info"><div class="name">@${u.username}${u.role === 'admin' ? ' ★' : ''}</div><div class="role">${u.blocked ? 'Заблокирован' : 'Активен'}</div></div>`;
    if (u.username !== me.username) {
      const b = document.createElement('button'); b.className = u.blocked ? 'b-success' : 'b-danger'; b.textContent = u.blocked ? 'Разблок.' : 'Блок';
      b.onclick = () => send({ type: 'admin_block', username: u.username, blocked: !u.blocked }); div.appendChild(b);
      const d = document.createElement('button'); d.className = 'b-ghost'; d.textContent = 'Удалить';
      d.onclick = () => { if (confirm('Удалить?')) send({ type: 'admin_delete', username: u.username }); }; div.appendChild(d);
    }
    box.appendChild(div);
  });
  box.innerHTML += '<div class="section-title">Все чаты</div>';
  if (!chats.length) box.innerHTML += '<div class="empty">Чатов нет</div>';
  chats.forEach(c => {
    const div = document.createElement('div'); div.className = 'admin-chat';
    div.onclick = () => send({ type: 'admin_read_chat', key: c.key });
    div.innerHTML = `<div class="row"><span>@${c.participants[0]} ↔ @${c.participants[1]}</span><span>${c.count}</span></div><div class="preview">${c.last ? esc(c.last.text) : 'Пусто'}</div>`;
    box.appendChild(div);
  });
}

ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'auth_ok') {
    me = msg.me; localStorage.setItem('great_me', me.username);
    document.getElementById('myName').textContent = '@' + me.username + (me.role === 'admin' ? ' (админ)' : '');
    document.getElementById('adminTab').style.display = me.role === 'admin' ? '' : 'none';
    showScreen('main'); switchTab('chats'); return;
  }
  if (msg.type === 'error') { alert(msg.text); return; }
  if (msg.type === 'online_list') { onlineUsers = msg.users; if (document.getElementById('main').classList.contains('active')) { const active = document.querySelector('.tab.active').dataset.tab; if (active === 'chats' || active === 'users') switchTab(active); } return; }
  if (msg.type === 'chat_history') { if (currentChat === msg.with) renderMessages(msg.messages); return; }
  if (msg.type === 'new_message') { if (currentChat === msg.message.from || currentChat === msg.message.to) send({ type: 'open_chat', with: currentChat }); return; }
  if (msg.type === 'admin_users') { adminUsers = msg.users; renderAdminView(adminUsers, adminChats); return; }
  if (msg.type === 'admin_chats') { adminChats = msg.chats; renderAdminView(adminUsers, adminChats); return; }
  if (msg.type === 'admin_chat_content') {
    const box = document.getElementById('tabContent');
    box.innerHTML = '<div class="search-wrap"><button class="btn b-ghost" onclick="renderAdminTab()">← Назад</button></div>';
    const list = document.createElement('div'); list.className = 'messages'; list.style.flex = 'none'; list.style.maxHeight = '60vh';
    msg.messages.forEach(m => {
      const d = new Date(m.time); const tm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      list.insertAdjacentHTML('beforeend', `<div class="msg ${m.from === me.username ? 'out' : 'in'}">${esc(m.text)}<span class="time">${m.from} ${tm}</span></div>`);
    });
    box.appendChild(list); return;
  }
};
ws.onopen = () => { const saved = localStorage.getItem('great_me'); if (saved) send({ type: 'register', username: saved }); };
</script>
</body>
</html>
